<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid px-20">

    <a class="navbar-brand logo" routerLink="/">
      <span class="go">Go</span>
      <span class="brand">सफ़र</span>
    </a>

    <ng-container *ngIf="isLoggedIn !== null">
      <div *ngIf="!isLoggedIn" class="ms-auto d-flex gap-2">
        <button class="btn btn-outline-light" (click)="navigateToLogin()">Login</button>
        <button class="btn signup-button" (click)="navigateToRegister()">Sign Up</button>
      </div>

    <div *ngIf="isLoggedIn" class="ms-auto d-flex align-items-center gap-3">
      <div class="profile-icon" (click)="navigateToHistory()" style="cursor: pointer; font-size: 1.5rem;">
        <i class="bi bi-person-circle text-light"></i>
      </div>
      <button class="btn btn-outline-light" (click)="logout()">
        Logout
      </button>
    </div>
  </ng-container>

  </div>
</nav>
