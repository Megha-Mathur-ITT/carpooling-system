<footer class="footer collapsed" [class.collapsed]="isCollapsed">
  <button class="footer-toggle" (click)="isCollapsed = !isCollapsed" type="button">
    <span class="toggle-label">Go<span class="accent">सफर</span></span>
    <i class="bi" [ngClass]="isCollapsed ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
  </button>

  <div class="footer-body">
    <div class="footer-container">

      <div class="footer-brand">
        <h2 class="logo">Go<span class="accent">सफर</span></h2>
        <p>Safe, affordable and eco-friendly travel. Connecting verified riders and drivers in real-time.</p>
      </div>

      <div class="footer-links">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="#">Home</a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      © 2026 GoSafar. All rights reserved.
    </div>
  </div>
</footer>
