<app-navbar></app-navbar>

<div class="container-fluid confirmation-wrapper">
  <div class="row align-items-stretch landing-row">

    <div class="col-md-5 left-section border p-4" *ngIf="selectedDriver; else loading">

      <div class="status-section mb-3">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h5 class="mb-0 text-success">Ride Accepted!</h5>
        </div>
        <p class="text-muted mb-0">
          <strong>{{ selectedDriver.driverName }}</strong> has accepted your request and is on the way!
        </p>
      </div>

      <hr>

      <div class="ride-details">
        
        <app-ride-summary 
          [pickup]="passengerPickup" 
          [destination]="passengerDestination"
        ></app-ride-summary>

        <div class="detail-row">
          <span class="detail-label">Driver</span>
          <span class="detail-value">{{ selectedDriver.driverName }}</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Vehicle</span>
          <span class="detail-value">{{ selectedDriver.vehicleName }}</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">License plate</span>
          <span class="detail-value">{{ selectedDriver.licensePlate }}</span>
        </div>

      </div>

      <button class="btn btn-outline-danger w-100 mt-4" (click)="cancelRide()">
        Cancel Ride
      </button>

    </div>

    <ng-template #loading>
      <div class="col-md-5 p-4 text-muted">Loading ride details...</div>
    </ng-template>

    <div class="col-md-7 p-0">
      <app-map 
        [pickup]="driverLocation" 
        [destination]="passengerPickup" 
        [showRoute]="false">
      </app-map>
    </div>

  </div>
</div>

<app-footer></app-footer>
