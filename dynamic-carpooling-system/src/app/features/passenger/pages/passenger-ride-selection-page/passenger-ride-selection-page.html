<app-navbar></app-navbar>

<div>
    <div class="container-fluid px-0 ride-selection-wrapper">
        <div class="row landing-row g-0">

            <!-- Right side -->
            <div class="col-12 col-lg-5 left-section border p-3">
                
                <h1 class="passenger-heading">
                    Ride Details
                </h1>

                <app-ride-summary
                    [pickup]="pickupLocation"
                    [destination]="destinationLocation"
                ></app-ride-summary>

                <div *ngIf="!isWaiting">
                    <app-nearby-drivers-list
                    [drivers]="drivers"
                    [isLoading]="isLoading"
                    [selectedDriver]="selectedDriver"
                    (driverSelected)="selectDriver($event)"
                    (rideRequested)="requestRide()"
                ></app-nearby-drivers-list>
                </div>

                <div *ngIf="isWaiting" class="waiting-state">
                    <h3>Request Sent!</h3>
                    <p>Waiting for <strong>{{ selectedDriver?.driverName }}</strong> to respond...</p>
                    <button class="btn btn-outline-danger mt-3" (click)="cancelRequest()">
                        Cancel Request
                    </button>
                </div>

            </div>

            <!-- Left side -->
            <div class="col-12 col-lg-7 right-section">
                <div class="map-placeholder">
                    <app-map [pickup]="pickupLocation" [destination]="destinationLocation" [drivers]="drivers"
                        [showRadiusCircle]="true"></app-map>
                </div>
            </div>
        </div>
    </div>
</div>

<app-footer></app-footer>
