<ng-container>
    <h1 class="driver-list-heading">Drivers List</h1>

    <div *ngIf="isLoading" class="no-drivers">
        Looking for drivers...
    </div>

    <div *ngIf="!isLoading && drivers.length === 0" class="no-drivers">
        {{ hasRejections
        ? 'All nearby drivers declined. Try again later.'
        : 'No drivers found matching your route.' }}
    </div>

    <app-driver-details-card *ngFor="let driver of drivers" [driverName]="driver.driverName"
        [vehicleName]="driver.vehicleName" [eta]="driver.availableSeats + ' seats'"
        [fare]="driver.distanceKm + ' km away'" [isSelected]="selectedDriver?.driverId === driver.driverId"
        (click)="onDriverClick(driver)" (onRequestRide)="onRequestRideHandler(driver)">
    </app-driver-details-card>
</ng-container>
