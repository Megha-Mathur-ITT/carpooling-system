<app-navbar></app-navbar>

<div class="driver-active-wrapper">
  <div class="left-section">
    <app-passenger-details
      *ngIf="rideData"
      [ride]="rideData"
      [distance]="distanceKm"
      [eta]="durationMin"
      [fare]="fare">
    </app-passenger-details>
  </div>

  <div class="right-section">
    <ng-container *ngIf="rideLoaded && rideData">
      <app-map
        [pickup]="rideData?.pickup"
        [destination]="rideData?.destination"
        (routeInfo)="onRouteInfo($event)">
      </app-map>
    </ng-container>
  </div>

  
</div>



<app-footer></app-footer>
