<app-navbar></app-navbar>

<div class="driver-layout">
  <div class="driver-panel">
    <app-toggler [isOnline]="isOnline"></app-toggler>

    <ng-container *ngIf="activeRide; else rideFormTemplate">
      <app-driver-active-ride-panel [activeRide]="activeRide" (rideCompleted)="onRideCompleted()"
        (rideCancelled)="onRideCancelled()">
      </app-driver-active-ride-panel>
    </ng-container>

    <ng-template #rideFormTemplate>
      <app-ride-form [currentLocation]="pickup" [destination]="destination"
        (currentLocationDetected)="onCurrentLocationDetected($event)"
        (destinationSelected)="onDestinationSelected($event)" (sessionStarted)="onSessionStarted()"
        (sessionStopped)="onSessionStopped()">
      </app-ride-form>
    </ng-template>
  </div>

  <div class="driver-map">
    <app-map [pickup]="pickup" [destination]="destination"></app-map>
  </div>
</div>

<app-ride-request-popup *ngIf="incomingRequest" [request]="incomingRequest" [currentDriverLat]="pickup?.latitude ?? 0"
  [currentDriverLng]="pickup?.longitude ?? 0" (accepted)="onRequestAccepted()" (rejected)="onRequestRejected()">
</app-ride-request-popup>

<app-footer></app-footer>
