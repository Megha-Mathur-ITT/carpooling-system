<div class="popup-overlay" *ngIf="request">
  <div class="popup-card">
    <div class="popup-header">
      <span class="icon"></span>
      <h3>New Ride Request</h3>
    </div>

    <div class="popup-body">
      <p><strong>Passenger:</strong> {{ request.passengerName }}</p>
      <p><strong>Pickup:</strong> {{ request.pickupName }}</p>
      <p><strong>Destination:</strong> {{ request.destinationName }}</p>
    </div>

    <div class="popup-actions">
      <button class="btn-reject" (click)="reject()" [disabled]="isLoading">
        ✕ Reject
      </button>
      <button class="btn-accept" (click)="accept()" [disabled]="isLoading">
        ✓ Accept
      </button>
    </div>
  </div>
</div>
