<div class="toggle-wrapper">
  
  <h1 class="driver-heading">
    Wanna Go <span class="accent-text">Active?</span>
  </h1>

  <div class="toggler-card">
    <label class="switch">
    <input 
      type="checkbox"
      [(ngModel)]="isActive"
      (change)="toggleStatus()"
    >
    <span class="slider"></span>
    </label>
    <div class="status-text">
      {{ isActive ? "Let's Go &#128663;" : "Offline  &#x26D4;" }}
    </div>
  </div>
 
</div>
