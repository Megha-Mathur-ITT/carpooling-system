<div class="active-ride-panel">

    <div class="panel-header">
        <div class="status-chip">
            <span class="live-dot"></span>
            Active Ride
        </div>
    </div>

    @if(!isPaymentPending) {
    <div class="info-card">
        <div class="card-label">
            <i class="bi bi-person-fill"></i>
            Passenger:
            <span class="passenger-name">{{ activeRide?.passengerName || 'Passenger' }}</span>
        </div>
    </div>

    <div class="info-card">
        <app-ride-summary [pickup]="activeRide?.pickupName"
            [destination]="activeRide?.destinationName"></app-ride-summary>
    </div>

    <div class="status-strip">
        <i class="bi bi-car-front-fill"></i>
        <span>Drive to pickup point</span>
    </div>
    }

    @if(isPaymentPending) {
    <div class="payment-confirmed">
        <h3><i class="fa-solid fa-sack-dollar fa-flip" style="color: rgb(165, 245, 5);"></i> Did you received cash?</h3>
        <p>Confirm that <strong>{{ activeRide?.passengerName }}</strong> paid the fare in cash.</p>

        <div class="fare-badge">
            <i class="fa-solid fa-indian-rupee-sign" style="color: rgb(165, 245, 5);"></i>
            {{ activeRide?.fare ?? '-' }}
        </div>

        <div class="payment-actions">
            <button class="button-deny-payment" (click)="denyCashReceived()">
                Not Yet
            </button>
            <button class="button-confirm-payment" (click)="confirmCashReceived()">
                Yes, Received
            </button>
        </div>
    </div>
    }

</div>
