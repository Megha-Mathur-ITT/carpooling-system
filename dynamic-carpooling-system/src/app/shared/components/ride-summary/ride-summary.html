<div class="ride-summary">
    <div class="route-point">
        <span class="dot dot-blue"></span>
        <div class="route-info">
            <span class="passenger-route-label">Pickup</span>
            <span class="passenger-route-value">{{ trimLocation(pickup?.name ?? pickup) }}</span>
        </div>
    </div>

    <div class="route-point">
        <span class="dot dot-red"></span>
        <div class="route-info">
            <span class="passenger-route-label">Destination</span>
            <span class="passenger-route-value">{{ trimLocation(destination?.name ?? destination) }}</span>
        </div>
    </div>
</div>
